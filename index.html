<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>CNS 약물 퀴즈</title>

<style>
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --ink:#16212B; --muted:#5B6874; --line:#D5DCE2;
  --cobalt:#2848A0; --cobalt-ink:#FFFFFF; --amber:#E7A532; --amber-ink:#3A2A06;
  --ok:#23784A; --ok-bg:#E3F2E8; --no:#B93A2B; --no-bg:#FBE7E3; --hl:#FFF1D2;
  --name:"Avenir Next Condensed","Avenir Next","Arial Narrow","Helvetica Neue",sans-serif;
  --body:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
}
/* 화면 색: 자동(기기 설정) · 밝게 · 어둡게 · 민트 · 라벤더 · 종이 */
@media (prefers-color-scheme: dark){
  :root:not([data-theme]), :root[data-theme="auto"]{ --bg:#14181D; --surface:#1D232A; --ink:#E7ECF0; --muted:#9AA6B1; --line:#323B45;
    --cobalt:#6F8EF0; --cobalt-ink:#0C1530; --amber:#E9B04A; --amber-ink:#2A1D03;
    --ok:#62C28A; --ok-bg:#183326; --no:#F08273; --no-bg:#3A1D19; --hl:#3A3220; }
}
:root[data-theme="dark"]{ --bg:#14181D; --surface:#1D232A; --ink:#E7ECF0; --muted:#9AA6B1; --line:#323B45;
    --cobalt:#6F8EF0; --cobalt-ink:#0C1530; --amber:#E9B04A; --amber-ink:#2A1D03;
    --ok:#62C28A; --ok-bg:#183326; --no:#F08273; --no-bg:#3A1D19; --hl:#3A3220; }
:root[data-theme="mint"]{ --bg:#E6F2EE; --surface:#FFFFFF; --ink:#13302A; --muted:#55706A; --line:#C6DDD5;
  --cobalt:#1D7A63; --cobalt-ink:#FFFFFF; --amber:#E7A532; --hl:#FFF2D4; --ok-bg:#DDF0E3; --no-bg:#FBE6E2; }
:root[data-theme="lavender"]{ --bg:#EEECF7; --surface:#FFFFFF; --ink:#211D36; --muted:#625C80; --line:#D6D1EA;
  --cobalt:#5847C2; --cobalt-ink:#FFFFFF; --amber:#E89B3A; --hl:#FFF0D9; }
:root[data-theme="paper"]{ --bg:#F2EBDD; --surface:#FBF7EE; --ink:#2D2517; --muted:#6E6352; --line:#DFD3BC;
  --cobalt:#8A5528; --cobalt-ink:#FFFFFF; --amber:#4E7C5B; --hl:#F6E7C4; --ok-bg:#E3EEDB; --no-bg:#F7E1D9; }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 var(--body);
  -webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app{max-width:760px;margin:0 auto;padding:28px 20px 48px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
button:disabled{cursor:default}
h1,h2{margin:0}

/* 캡슐 배지: 단원 번호 */
.pill{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:24px;border-radius:12px;
  background:linear-gradient(90deg,var(--cobalt) 0 50%,var(--amber) 50% 100%);flex:none}
.pill i{font:700 13px/1 var(--name);font-style:normal;color:#fff;background:var(--cobalt);padding:3px 7px;border-radius:9px;letter-spacing:.02em}
.pill.sm{min-width:34px;height:18px}.pill.sm i{font-size:11px;padding:2px 5px}

/* 홈 */
.home-head{padding:8px 0 20px}
.home-head h1{font:700 44px/1.05 var(--body);letter-spacing:-.02em}
.lede{margin:12px 0 0;color:var(--muted);max-width:34em}
.block{margin-top:26px}
.bhead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.bhead h2{font-size:19px;font-weight:700}
.links{display:flex;gap:14px}
.link{background:none;border:0;padding:6px 0;color:var(--cobalt);font-size:15px}
.link.danger{color:var(--no)}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.unit{display:flex;align-items:center;gap:10px;text-align:left;padding:12px 12px;border-radius:12px;
  background:var(--surface);border:1.5px solid var(--line);min-height:54px}
.unit .uname{flex:1;font-size:15.5px;line-height:1.25}
.unit .ucount{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.unit:not(.on){opacity:.55}
.unit:not(.on) .pill{filter:grayscale(1)}
.unit.on{border-color:var(--cobalt)}
.types{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.trow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:13px 16px;background:none;border:0;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.trow .tl{flex:1;display:flex;flex-direction:column}
.trow small{color:var(--muted);font-size:13.5px}
.trow .tc{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.check{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);flex:none;position:relative}
.trow.on .check{background:var(--cobalt);border-color:var(--cobalt)}
.trow.on .check::after{content:"";position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid var(--cobalt-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.segs{display:flex;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:3px}
.seg{flex:1;padding:10px 0;border:0;background:none;border-radius:9px;font-variant-numeric:tabular-nums}
.seg.on{background:var(--ink);color:var(--bg);font-weight:600}
.toggle{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:15.5px;color:var(--muted)}
.toggle input{width:20px;height:20px;accent-color:var(--cobalt)}
.actions{margin-top:28px;display:flex;flex-direction:column;gap:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.primary{width:100%;padding:17px;border:0;border-radius:14px;background:var(--cobalt);color:var(--cobalt-ink);font-size:18px;font-weight:700}
.primary:disabled{background:var(--line);color:var(--muted)}
.secondary{padding:15px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:600}
.secondary b{color:var(--no);margin-left:4px}
.secondary:disabled{opacity:.5}
.stats{display:flex;flex-direction:column;gap:9px}
.srow{display:grid;grid-template-columns:minmax(0,1.4fr) 2fr 44px 48px;align-items:center;gap:10px;font-size:14.5px}
.sname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:var(--amber)}
.sp{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.sn{text-align:right;color:var(--muted);font-size:13px}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.th{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 6px 10px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:14px}
.th.on{border-color:var(--cobalt);box-shadow:inset 0 0 0 1px var(--cobalt)}
.sw{width:44px;height:28px;border-radius:14px;border:1px solid rgba(0,0,0,.12);display:flex;overflow:hidden}
.sw i{flex:1}
.foot{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px}

/* 퀴즈 */
.qtop{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.icon{width:42px;height:42px;border-radius:21px;border:1.5px solid var(--line);background:var(--surface);font-size:17px;flex:none}
.prog{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.prog span{display:block;height:100%;background:var(--cobalt);transition:width .3s}
.count{font:700 20px/1 var(--name);font-variant-numeric:tabular-nums}
.count small{color:var(--muted);font-weight:500}
.qcard{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:22px 20px 20px}
.qmeta{display:flex;align-items:center;flex-wrap:wrap;gap:8px;color:var(--muted);font-size:14px}
.kind{border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:12.5px}
.kind.w{color:var(--no);border-color:var(--no)}
.stem{margin:16px 0 18px;font-size:21px;line-height:1.5;font-weight:600;word-break:keep-all}
.stem .dn{font:700 34px/1.1 var(--name);letter-spacing:.005em;display:inline-block;margin-right:2px}
.stem .hl{background:var(--hl);padding:1px 6px;border-radius:5px;font-weight:700}
.stem .sig{display:block;margin-top:12px;padding:12px 14px;border-left:4px solid var(--amber);background:var(--hl);border-radius:0 8px 8px 0;font-weight:500;font-size:18.5px}
.opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.opt{width:100%;display:flex;align-items:flex-start;gap:12px;text-align:left;padding:14px 15px;border-radius:13px;
  border:1.5px solid var(--line);background:var(--bg);font-size:17px;line-height:1.45;min-height:56px;transition:background .15s,border-color .15s}
.opt .num{font-size:20px;line-height:1.2;color:var(--muted);flex:none}
.opt .ot{flex:1;word-break:keep-all;overflow-wrap:anywhere}
@media (hover:hover){.opt:not(:disabled):hover{border-color:var(--cobalt)}}
.opt:not(:disabled):active{transform:scale(.99)}
.opt.correct{background:var(--ok-bg);border-color:var(--ok)}
.opt.correct .num{color:var(--ok)}
.opt.wrong{background:var(--no-bg);border-color:var(--no)}
.opt.wrong .num{color:var(--no)}
.opt.dim{opacity:.5}
.opt:disabled{color:var(--ink)}
#fb:empty{display:none}
#fb{margin-top:18px}
.verdict{font-weight:700;font-size:19px;margin-bottom:10px}
.verdict.ok{color:var(--ok)}.verdict.no{color:var(--no)}
.expl{padding:13px 15px;border-radius:12px;background:var(--bg);font-size:16px;line-height:1.6;word-break:keep-all}
.note{margin:10px 2px 0;color:var(--muted);font-size:15px}
.next{margin-top:16px}
.score{text-align:center;color:var(--muted);font-size:14px;margin-top:14px;font-variant-numeric:tabular-nums}

/* 약물 카드 */
.dcard{padding:14px 15px;border-radius:12px;background:var(--bg);margin-top:10px}
.dtitle{color:var(--muted);font-size:13px;margin-bottom:2px}
.dname{font:700 24px/1.2 var(--name);display:flex;align-items:center;gap:8px}
.dcard dl{display:grid;grid-template-columns:44px 1fr;gap:4px 10px;margin:8px 0 0;font-size:15.5px;line-height:1.5}
.dcard dt{color:var(--muted)}
.dcard dd{margin:0;word-break:keep-all}

/* 결과 */
.res-head{padding:24px 0 6px}
.big{font:700 84px/1 var(--name);font-variant-numeric:tabular-nums}
.big small{font-size:40px;color:var(--muted)}
.res-head p{color:var(--muted);margin:10px 0 0}
.wlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.wlist li{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 15px}
.wq{font-weight:600;margin-bottom:8px;word-break:keep-all}
.wq .dn{font:700 22px var(--name)}
.wq .sig{display:block;font-weight:500;margin-top:4px;color:var(--muted)}
.wa{font-size:15.5px;margin-top:4px;display:flex;gap:8px;align-items:baseline}
.tag{flex:none;font-size:12px;padding:1px 7px;border-radius:6px;font-weight:600}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.no{background:var(--no-bg);color:var(--no)}

/* 사전 */
.dhead{font-size:22px}
.search{width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;-webkit-appearance:none}
.chips{display:flex;gap:7px;overflow-x:auto;padding:12px 0 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);font-size:14.5px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dlist .dcard{background:var(--surface);border:1.5px solid var(--line)}
.empty{color:var(--muted);padding:30px 0;text-align:center}

@media (max-width:520px){
  #app{padding:18px 16px 40px}
  .home-head h1{font-size:36px}
  .stem{font-size:19px}.stem .dn{font-size:30px}
  .srow{grid-template-columns:1fr 1.2fr 40px;}.sn{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
// [이름, 단원, 분류, 기전, 기전그룹(공백구분), 용도, 특징(sig), 플래그(nc=분류문제X, nm=기전문제X), 특징문제에서 제외할 약(쉼표)]
const UNITS = {

const BZD_M = "GABAA R 결합 (α1 & γ2 subunit)";
const BRT_M = "GABAA R 결합 (multiple subunits) — 억제 강도 가장 강함";

const NDP_M = "NM R competitive antagonist";
const ATYP_M = "D2 + 5-HT2A R 차단";
const TYP_M = "D2 R 차단";
const TCA_M = "SERT + NET 억제 (+M, H1, α1 차단)";

const DRUG_ROWS = [
  // ───── 1. Sedative-hypnotics & anxiolytics
  ["Alprazolam",1,"Benzodiazepine",BZD_M,"GABAA","불안 — 특히 panic disorder, agoraphobia (중시간형)","panic disorder·agoraphobia에 특히 쓰이는 BZD"],
  ["Chlordiazepoxide",1,"Benzodiazepine",BZD_M,"GABAA","불안 · 알코올 금단(long-acting)","demoxepam(장) → nordazepam(장)으로 대사되는 BZD"],
  ["Clorazepate",1,"Benzodiazepine",BZD_M,"GABAA","항경련(성인 impaired awareness) · 단시간형이지만 장시간 활성대사체(nordazepam) 생성"],
  ["Clonazepam",1,"Benzodiazepine",BZD_M,"GABAA","불안 · 항경련: absence 대체, myoclonic, IS, LGS"],
  ["Diazepam",1,"Benzodiazepine",BZD_M,"GABAA","불안 · 알코올 금단 · status epilepticus 1st · spasmolytic · 마취 전처치 · 국소마취제/TCA 경련","BZD 중 유일하게 spasmolytic(근이완)으로 쓰이며, nordazepam으로 대사되는 장시간형"],
  ["Estazolam",1,"Benzodiazepine",BZD_M,"GABAA","진정·수면"],
  ["Flurazepam",1,"Benzodiazepine",BZD_M,"GABAA","수면 · 장시간 활성대사체 생성","N-desalkylflurazepam(장시간 활성대사체)을 만드는 BZD"],
  ["Lorazepam",1,"Benzodiazepine",BZD_M,"GABAA","불안 · 알코올 금단(short) · status epilepticus 1st · premedication · cocaine/amphetamine 중독 경련"],
  ["Midazolam",1,"Benzodiazepine",BZD_M,"GABAA","마취 전처치(iv, anterograde amnesia) · refractory status epilepticus"],
  ["Nitrazepam",1,"Benzodiazepine",BZD_M,"GABAA","항경련: IS, myoclonic, LGS"],
  ["Oxazepam",1,"Benzodiazepine",BZD_M,"GABAA","불안 · 알코올 금단(short) · 바로 glucuronide conjugation"],
  ["Quazepam",1,"Benzodiazepine",BZD_M,"GABAA","진정·수면"],
  ["Temazepam",1,"Benzodiazepine",BZD_M,"GABAA","불면 — 수면 유지 곤란 (t½ 8.8h)","t½ 8.8h → 수면 '유지' 곤란에 쓰는 BZD"],
  ["Triazolam",1,"Benzodiazepine",BZD_M,"GABAA","불면 — 수면 유도 곤란 (t½ 2h)","t½ 2h → 수면 '유도' 곤란에 쓰는 BZD"],
  ["Amobarbital",1,"Barbiturate",BRT_M,"GABAA","진정·수면 (드물게 사용)"],
  ["Butabarbital",1,"Barbiturate",BRT_M,"GABAA","진정·수면 (드물게 사용)"],
  ["Mephobarbital",1,"Barbiturate",BRT_M,"GABAA","진정·수면 (드물게 사용)"],
  ["Pentobarbital",1,"Barbiturate",BRT_M,"GABAA","Refractory status epilepticus (마취용량)"],
  ["Phenobarbital",1,"Barbiturate",BRT_M,"GABAA","항경련(long-acting): neonatal seizure 1st, focal, GTC, status(iv)","강력한 CYP inducer이며 weak acid라 과량 시 urine 알칼리화로 배설↑"],
  ["Secobarbital",1,"Barbiturate",BRT_M,"GABAA","수면 (드물게 사용)"],
  ["Thiopental",1,"Barbiturate",BRT_M,"GABAA","Ultra-short: 정맥 마취 유도 · refractory status"],
  ["Methohexital",1,"Barbiturate",BRT_M,"GABAA","Ultra-short(지용성): 정맥 마취 유도"],
  ["Zolpidem",1,"Z-drug",Z_M,"GABAA","불면 — 유도+유지 곤란 (t½ 2–3h)","nightmares·몽유병이 특이 AE인 수면제"],
  ["Zaleplon",1,"Z-drug",Z_M,"GABAA","불면 — 유도 곤란만 (t½ 1h)","t½ 1h로 가장 짧아 수면 유도 곤란에만 쓰는 Z-drug"],
  ["Eszopiclone",1,"Z-drug",Z_M,"GABAA","불면 — 유도+유지 곤란 (t½ 6h)","t½ 6h로 Z-drug 중 가장 긴 약"],
  ["Ramelteon",1,"Melatonin R agonist","Selective melatonin R agonist","MT","불면","의존성·금단이 없어 장기복용 가능하지만 효과는 marginal한 수면제","","Tasimelteon"],
  ["Tasimelteon",1,"Melatonin R agonist","Selective melatonin R agonist","MT","불면"],
  ["Suvorexant",1,"Orexin R antagonist","Orexin 1·2 R antagonist","OX","불면","AE: day-after sedation, narcolepsy, 우울 악화, 자살충동","","Lemborexant"],
  ["Lemborexant",1,"Orexin R antagonist","Orexin 1·2 R antagonist","OX","불면"],
  ["Buspirone",1,"비-BZD 항불안제","5-HT1A partial agonist (+weak D2 block)","5HT1A D2","불안 (2nd)","발현이 느려(1주 이상) 급성 불안에 부적합한 항불안제"],

// ───── 데이터 정리
const DRUGS = DRUG_ROWS.map(r => {
  const f = r[7] || "";
  return {
    n: r[0], u: r[1], c: r[2], m: r[3] || "",
    g: (r[4] || "").split(/\s+/).filter(Boolean),
    use: r[5] || "", s: r[6] || "",
    nm: f.includes("nm") || !r[3],
    nc: f.includes("nc"),
    x: (r[8] || "").split(",").map(s => s.trim()).filter(Boolean)
  };
});
const BYNAME = Object.fromEntries(DRUGS.map(d => [d.n, d]));

function hash(s) {
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
  return (h >>> 0).toString(36);
}
const CUR = CURATED.map(r => ({ id: "c:" + hash(r[1] + "|" + r[2]), u: r[0], q: r[1], a: r[2], d: r[3], e: r[4] || "" }));

const TYPES = {
  cur:   { label: "개념 문제", desc: "강의록 기반 문항" },
  mech:  { label: "약 → 기전", desc: "이 약의 기전은?" },
  rmech: { label: "기전 → 약", desc: "이 기전을 가진 약은?" },
  class: { label: "분류 맞히기", desc: "어느 계열?" },
  sig:   { label: "특징 → 약", desc: "부작용·특징으로 약 찾기" }
};

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
// BZD / Barbiturate / Z-drug의 결합 subunit 설명은 서로 배타적이라 함정 보기로 허용
const TRIO = new Set([BZD_M, BRT_M, Z_M]);
const shares = (a, b) => {
  if (TRIO.has(a.m) && TRIO.has(b.m) && a.m !== b.m) return a.g.some(x => x !== "GABAA" && b.g.includes(x));
  return a.g.some(x => b.g.includes(x));
};
const conflict = (a, b) => a.x.includes(b.n) || b.x.includes(a.n);

// 같은 단원 → 다른 단원 순으로 후보 정렬
function tiered(cands, unit, firstTier) {
  const t0 = firstTier ? shuffle(cands.filter(firstTier)) : [];
  const rest = cands.filter(c => !t0.includes(c));
  return t0.concat(shuffle(rest.filter(c => c.u === unit)), shuffle(rest.filter(c => c.u !== unit)));
}
function takeDistinct(list, keyFn, n, used) {
  const out = [];
  const seen = new Set(used || []);
  for (const it of list) {
    const k = keyFn(it);
    if (seen.has(k)) continue;
    seen.add(k);
    out.push(it);
    if (out.length >= n) break;
  }
  return out;
}

// ───── 문제 풀(pool) 만들기 — 문제의 '틀'만 만들고 보기는 출제 시점에 랜덤 생성
function buildPool(units, types) {
  const P = [];
  if (types.has("cur")) CUR.forEach(c => { if (units.has(c.u)) P.push({ id: c.id, u: c.u, kind: "cur", ref: c }); });
  const ds = DRUGS.filter(d => units.has(d.u));
  if (types.has("mech")) ds.forEach(d => { if (!d.nm) P.push({ id: "am:" + d.n, u: d.u, kind: "mech", ref: d }); });
  if (types.has("rmech")) {
    const groups = new Map();
    ds.forEach(d => {
      if (d.nm) return;
      const k = d.u + "|" + d.m;
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(d);
    });
    for (const [k, arr] of groups) P.push({ id: "ar:" + hash(k), u: arr[0].u, kind: "rmech", ref: arr });
  }
  if (types.has("class")) ds.forEach(d => {
    if (CLASSQ_UNITS.includes(d.u) && !d.nc && classOptions(d).length >= 2) P.push({ id: "ac:" + d.n, u: d.u, kind: "class", ref: d });
  });
  if (types.has("sig")) ds.forEach(d => { if (d.s) P.push({ id: "as:" + d.n, u: d.u, kind: "sig", ref: d }); });
  return P;
}

function classOptions(d) {
  const set = new Set(DRUGS.filter(o => o.u === d.u && !o.nc && o.c !== d.c).map(o => o.c));
  return [...set];
}

// ───── 출제: 실제 보기 생성
// 반환: {stem, options:[{t, info}], correct(index), expl, drug}
function materialize(item) {
  if (item.kind === "cur") {
    const c = item.ref;
    const opts = shuffle([c.a, ...c.d]);
    return { stem: esc(c.q), options: opts.map(t => ({ t })), correct: opts.indexOf(c.a), expl: c.e ? esc(c.e) : "" };
  }
  if (item.kind === "mech") {
    const d = item.ref;
    const cands = DRUGS.filter(o => !o.nm && o.n !== d.n && !shares(o, d) && o.m !== d.m);
    const picks = takeDistinct(tiered(cands, d.u), o => o.m, 4, [d.m]);
    const opts = shuffle([{ t: d.m, drug: d }, ...picks.map(o => ({ t: o.m, drug: o, mechOf: true }))]);
    return {
      stem: `<b class="dn">${esc(d.n)}</b>의 기전은?`,
      options: opts, correct: opts.findIndex(o => o.drug === d), drug: d
    };
  }
  if (item.kind === "rmech") {
    const arr = item.ref;
    const ans = arr[Math.floor(Math.random() * arr.length)];
    const cands = DRUGS.filter(o => !o.nm && !arr.includes(o) && !shares(o, ans) && o.m !== ans.m);
    const picks = takeDistinct(tiered(cands, ans.u), o => o.n, 4, [ans.n]);
    const opts = shuffle([{ t: ans.n, drug: ans }, ...picks.map(o => ({ t: o.n, drug: o }))]);
    return {
      stem: `기전이 <span class="hl">${esc(ans.m)}</span>인 약물은?`,
      options: opts, correct: opts.findIndex(o => o.drug === ans), drug: ans,
      also: arr.length > 1 ? arr.filter(o => o !== ans).map(o => o.n) : null
    };
  }
  if (item.kind === "class") {
    const d = item.ref;
    const others = shuffle(classOptions(d)).slice(0, 4);
    const opts = shuffle([d.c, ...others]).map(t => ({ t, cls: t }));
    return {
      stem: `<b class="dn">${esc(d.n)}</b>의 분류는?`,
      options: opts, correct: opts.findIndex(o => o.t === d.c), drug: d
    };
  }
  if (item.kind === "sig") {
    const d = item.ref;
    const cands = DRUGS.filter(o => o.n !== d.n && !conflict(o, d) && o.s !== d.s);
    const sameClass = shuffle(cands.filter(o => o.c === d.c)).slice(0, 2);
    const rest = tiered(cands.filter(o => !sameClass.includes(o)), d.u);
    const picks = takeDistinct(sameClass.concat(rest), o => o.n, 4, [d.n]);
    const opts = shuffle([{ t: d.n, drug: d }, ...picks.map(o => ({ t: o.n, drug: o }))]);
    return {
      stem: `다음 특징에 해당하는 약물은?<span class="sig">${esc(d.s)}</span>`,
      options: opts, correct: opts.findIndex(o => o.drug === d), drug: d
    };
  }
}

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

if (typeof module !== "undefined") module.exports = { DRUGS, CUR, buildPool, materialize, UNITS, TYPES, classOptions };

  return s;
}

  $("#prio").onchange = e => { state.set.prio = e.target.checked; save(); renderHome(); };
  $("#start").onclick = () => startQuiz(pool, "normal");
  $("#wrongBtn").onclick = () => startQuiz(Object.keys(state.wrong).map(id => POOL_BY_ID[id]).filter(Boolean), "wrong");
  $("#dictBtn").onclick = () => renderDict();
  $("#reset").onclick = () => {
    if (confirm("맞힌·틀린 기록과 오답노트를 모두 지울까요? 설정은 유지됩니다.")) { state.q = {}; state.wrong = {}; save(); renderHome(); }
  };
  window.scrollTo(0, 0);
}

function renderStats() {
  const rows = ALL_UNITS.map(u => {
    let c = 0, w = 0;
    for (const [id, v] of Object.entries(state.q)) { const p = POOL_BY_ID[id]; if (p && p.u === u) { c += v[0]; w += v[1]; } }
    return { u, c, w, t: c + w };
  }).filter(r => r.t > 0);
  if (!rows.length) return "";
  return `<section class="block">
    <div class="bhead"><h2>단원별 정답률</h2></div>
    <div class="stats">${rows.map(r => {
      const p = Math.round(r.c / r.t * 100);
      return `<div class="srow"><span class="sname">${r.u}. ${UNITS[r.u]}</span>
        <span class="bar"><span style="width:${p}%"></span></span><span class="sp">${p}%</span><span class="sn">${r.t}회</span></div>`;
    }).join("")}</div></section>`;
}

// ───── 퀴즈
function startQuiz(pool, mode) {
  if (!pool.length) return;
  let list;
  if (mode === "wrong" || mode === "retry") list = shuffle(pool);
  else if (state.set.prio) {
    list = pool.map(p => {
      const r = state.q[p.id];
      const rank = state.wrong[p.id] ? 0 : !r ? 1 : 2;
      return { p, k: rank + Math.random() * 0.9 };
    }).sort((a, b) => a.k - b.k).map(x => x.p);
  } else list = shuffle(pool);
  const n = mode === "normal" && state.set.count ? Math.min(state.set.count, list.length) : list.length;
  session = { mode, items: list.slice(0, n), i: 0, log: [], cur: null, answered: false };
  nextQ();
}

function nextQ() {
  if (session.i >= session.items.length) return renderResult();
  const item = session.items[session.i];
  session.cur = { item, m: materialize(item) };
  session.answered = false;
  renderQ();
}

const NUMS = ["①","②","③","④","⑤"];
function renderQ() {
  const { item, m } = session.cur;
  const total = session.items.length, idx = session.i;
  const right = session.log.filter(l => l.ok).length;
  const kindLabel = TYPES[item.kind].label;
  app().innerHTML = `
  <div class="qtop">
    <button class="icon" id="quit" aria-label="그만 풀기">✕</button>
    <div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${idx}"><span style="width:${idx / total * 100}%"></span></div>
    <span class="count">${idx + 1}<small>/${total}</small></span>
  </div>
  <article class="qcard">
    <div class="qmeta"><span class="pill sm"><i>${item.u}</i></span><span>${UNITS[item.u]}</span><span class="kind">${kindLabel}</span>${session.mode === "wrong" ? `<span class="kind w">오답노트</span>` : ""}</div>
    <h2 class="stem">${m.stem}</h2>
    <ol class="opts">${m.options.map((o, i) =>
      `<li><button class="opt" data-i="${i}"><span class="num">${NUMS[i]}</span><span class="ot">${esc(o.t)}</span></button></li>`).join("")}</ol>
    <div id="fb"></div>
  </article>
  <div class="score">맞힌 문제 ${right} / ${idx}</div>`;
  app().querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.i));
  $("#quit").onclick = () => {
    if (!session.log.length || confirm("지금까지 푼 기록은 저장돼요. 그만 풀까요?")) session.log.length ? renderResult() : renderHome();
  };
  window.scrollTo(0, 0);
}

function answer(i) {
  if (session.answered) return;
  session.answered = true;
  const { item, m } = session.cur;
  const ok = i === m.correct;
  const r = state.q[item.id] || [0, 0, 0];
  ok ? r[0]++ : r[1]++; r[2] = Date.now();
  state.q[item.id] = r;
  if (ok) delete state.wrong[item.id]; else state.wrong[item.id] = Date.now();
  save();
  session.log.push({ item, m, chosen: i, ok });

  app().querySelectorAll(".opt").forEach((b, k) => {
    b.disabled = true;
    if (k === m.correct) b.classList.add("correct");
    else if (k === i) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  const sc = app().querySelector(".score");
  if (sc) sc.textContent = `맞힌 문제 ${session.log.filter(l => l.ok).length} / ${session.log.length}`;
  const last = session.i + 1 >= session.items.length;
  $("#fb").innerHTML = `
    <div class="verdict ${ok ? "ok" : "no"}">${ok ? "정답" : `오답 — 정답은 ${NUMS[m.correct]}`}</div>
    ${explain(item, m, i)}
    <button class="primary next" id="next">${last ? "결과 보기" : "다음 문제"}</button>`;
  $("#next").onclick = () => { session.i++; nextQ(); };
  $("#next").focus({ preventScroll: true });
  $("#fb").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "nearest" });
}

function drugCard(d, title) {
  return `<div class="dcard">
    ${title ? `<div class="dtitle">${title}</div>` : ""}
    <div class="dname">${esc(d.n)} <span class="pill sm"><i>${d.u}</i></span></div>
    <dl>
      <dt>분류</dt><dd>${esc(d.c)}</dd>
      ${d.m ? `<dt>기전</dt><dd>${esc(d.m)}</dd>` : ""}
      ${d.use && d.use !== "—" ? `<dt>용도</dt><dd>${esc(d.use)}</dd>` : ""}
      ${d.s ? `<dt>특징</dt><dd>${esc(d.s)}</dd>` : ""}
    </dl></div>`;
}

function explain(item, m, chosen) {
  if (item.kind === "cur") return m.expl ? `<div class="expl">${m.expl}</div>` : "";
  let h = drugCard(m.drug, "정답 약물");
  if (m.also && m.also.length) h += `<p class="note">같은 기전: ${m.also.map(esc).join(", ")}</p>`;
  if (chosen !== m.correct) {
    const o = m.options[chosen];
    if (o.drug && item.kind !== "mech") h += drugCard(o.drug, "고른 약물");
    else if (o.drug && item.kind === "mech") {
      const owners = DRUGS.filter(d => d.m === o.t).map(d => d.n);
      h += `<p class="note">고른 보기는 ${esc(owners.slice(0, 4).join(", "))}${owners.length > 4 ? " 등" : ""}의 기전입니다.</p>`;
    } else if (o.cls) {
      const ex = DRUGS.filter(d => d.c === o.cls).map(d => d.n);
      h += `<p class="note">${esc(o.cls)}: ${esc(ex.slice(0, 5).join(", "))}${ex.length > 5 ? " 등" : ""}</p>`;
    }
  }
  return h;
}

// ───── 결과
function renderResult() {
  const log = session.log;
  const right = log.filter(l => l.ok).length;
  const wrongs = log.filter(l => !l.ok);
  const p = log.length ? Math.round(right / log.length * 100) : 0;
  app().innerHTML = `
  <header class="res-head">
    <div class="big">${right}<small>/${log.length}</small></div>
    <p>정답률 ${p}%${wrongs.length ? ` · 틀린 ${wrongs.length}문제는 오답노트에 들어갔어요.` : " · 모두 맞혔어요."}</p>
  </header>
  <div class="actions">
    ${wrongs.length ? `<button class="primary" id="retryW">틀린 ${wrongs.length}문제 다시 풀기</button>` : ""}
    <div class="row2">
      <button class="secondary" id="again">새 문제 풀기</button>
      <button class="secondary" id="home">처음으로</button>
    </div>
  </div>
  ${wrongs.length ? `<section class="block"><div class="bhead"><h2>틀린 문제</h2></div>
    <ol class="wlist">${wrongs.map(l => `<li>
      <div class="wq">${l.m.stem}</div>
      <div class="wa"><span class="tag no">고른 답</span>${esc(l.m.options[l.chosen].t)}</div>
      <div class="wa"><span class="tag ok">정답</span>${esc(l.m.options[l.m.correct].t)}</div>
    </li>`).join("")}</ol></section>` : ""}`;
  const again = $("#again"), home = $("#home"), rw = $("#retryW");
  if (rw) rw.onclick = () => startQuiz(wrongs.map(l => l.item), "retry");
  again.onclick = () => startQuiz(buildPool(new Set(state.set.units), new Set(state.set.types)), "normal");
  home.onclick = () => renderHome();
  window.scrollTo(0, 0);
}

// ───── 약물 사전
let dictUnit = 0, dictQ = "";
function renderDict() {
  session = null;
  const chips = [0, ...ALL_UNITS.filter(u => u <= 10)].map(u =>
    `<button class="chip ${dictUnit === u ? "on" : ""}" data-u="${u}">${u ? u + ". " + UNITS[u] : "전체"}</button>`).join("");
  app().innerHTML = `
  <div class="qtop"><button class="icon" id="back" aria-label="처음으로">✕</button><h2 class="dhead">약물 사전</h2></div>
  <input class="search" id="q" type="search" placeholder="약 이름, 기전, 부작용으로 찾기" value="${esc(dictQ)}" autocomplete="off" autocapitalize="off" spellcheck="false">
  <div class="chips">${chips}</div>
  <div id="dlist" class="dlist"></div>`;
  $("#back").onclick = () => renderHome();
  app().querySelectorAll(".chip").forEach(b => b.onclick = () => { dictUnit = +b.dataset.u; renderDict(); });
  const q = $("#q");
  q.oninput = () => { dictQ = q.value; fillDict(); };
  fillDict();
}
function fillDict() {
  const t = dictQ.trim().toLowerCase();
  const list = DRUGS.filter(d => (!dictUnit || d.u === dictUnit) &&
    (!t || [d.n, d.c, d.m, d.use, d.s].join(" ").toLowerCase().includes(t)));
  $("#dlist").innerHTML = list.length
    ? list.map(d => drugCard(d)).join("")
    : `<p class="empty">“${esc(dictQ)}”에 맞는 약이 없어요. 철자를 바꾸거나 단원을 ‘전체’로 바꿔 보세요.</p>`;
}

// ───── 키보드 (아이패드 키보드 연결 시)
document.addEventListener("keydown", e => {
  if (!session || !session.cur) return;
  if (e.target && e.target.tagName === "INPUT") return;
  const k = e.key;
  if (e.target && e.target.tagName === "BUTTON" && (k === "Enter" || k === " ")) return; // 버튼 자체 클릭으로 처리
  if (!session.answered && /^[1-5]$/.test(k)) { const i = +k - 1; if (i < session.cur.m.options.length) answer(i); }
  else if (session.answered && (k === "Enter" || k === " ")) { e.preventDefault(); session.i++; nextQ(); }
});

renderHome();

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(() => {});
}

</script>
</body>
</html>
