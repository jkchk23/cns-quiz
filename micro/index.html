<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>미생물 서술형</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="약리·미생물">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF1F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14181D" media="(prefers-color-scheme: dark)">
<script>try{var h=JSON.parse(localStorage.getItem("study-hub-v1"))||{},t=h.theme;if(!t){var o=JSON.parse(localStorage.getItem("micro-essay-v1"));t=o&&o.set&&o.set.theme}if(t&&t!=="auto")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" href="../icon-180.png">
<link rel="manifest" href="../manifest.json">
<style>
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --ink:#16212B; --muted:#5B6874; --line:#D5DCE2;
  --cobalt:#2848A0; --cobalt-ink:#FFFFFF; --amber:#E7A532; --amber-ink:#3A2A06;
  --ok:#23784A; --ok-bg:#E3F2E8; --no:#B93A2B; --no-bg:#FBE7E3; --hl:#FFF1D2;
  --name:"Avenir Next Condensed","Avenir Next","Arial Narrow","Helvetica Neue",sans-serif;
  --body:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
}
/* 화면 색: 자동(기기 설정) · 밝게 · 어둡게 · 민트 · 라벤더 · 종이 */
@media (prefers-color-scheme: dark){
  :root:not([data-theme]), :root[data-theme="auto"]{ --bg:#14181D; --surface:#1D232A; --ink:#E7ECF0; --muted:#9AA6B1; --line:#323B45;
    --cobalt:#6F8EF0; --cobalt-ink:#0C1530; --amber:#E9B04A; --amber-ink:#2A1D03;
    --ok:#62C28A; --ok-bg:#183326; --no:#F08273; --no-bg:#3A1D19; --hl:#3A3220; }
}
:root[data-theme="dark"]{ --bg:#14181D; --surface:#1D232A; --ink:#E7ECF0; --muted:#9AA6B1; --line:#323B45;
    --cobalt:#6F8EF0; --cobalt-ink:#0C1530; --amber:#E9B04A; --amber-ink:#2A1D03;
    --ok:#62C28A; --ok-bg:#183326; --no:#F08273; --no-bg:#3A1D19; --hl:#3A3220; }
:root[data-theme="mint"]{ --bg:#E6F2EE; --surface:#FFFFFF; --ink:#13302A; --muted:#55706A; --line:#C6DDD5;
  --cobalt:#1D7A63; --cobalt-ink:#FFFFFF; --amber:#E7A532; --hl:#FFF2D4; --ok-bg:#DDF0E3; --no-bg:#FBE6E2; }
:root[data-theme="lavender"]{ --bg:#EEECF7; --surface:#FFFFFF; --ink:#211D36; --muted:#625C80; --line:#D6D1EA;
  --cobalt:#5847C2; --cobalt-ink:#FFFFFF; --amber:#E89B3A; --hl:#FFF0D9; }
:root[data-theme="paper"]{ --bg:#F2EBDD; --surface:#FBF7EE; --ink:#2D2517; --muted:#6E6352; --line:#DFD3BC;
  --cobalt:#8A5528; --cobalt-ink:#FFFFFF; --amber:#4E7C5B; --hl:#F6E7C4; --ok-bg:#E3EEDB; --no-bg:#F7E1D9; }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 var(--body);
  -webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app{max-width:760px;margin:0 auto;padding:28px 20px 48px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
button:disabled{cursor:default}
h1,h2{margin:0}

/* 캡슐 배지: 단원 번호 */
.pill{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:24px;border-radius:12px;
  background:linear-gradient(90deg,var(--cobalt) 0 50%,var(--amber) 50% 100%);flex:none}
.pill i{font:700 13px/1 var(--name);font-style:normal;color:#fff;background:var(--cobalt);padding:3px 7px;border-radius:9px;letter-spacing:.02em}
.pill.sm{min-width:34px;height:18px}.pill.sm i{font-size:11px;padding:2px 5px}

/* 홈 */
.home-head{padding:8px 0 20px}
.home-head h1{font:700 44px/1.05 var(--body);letter-spacing:-.02em}
.lede{margin:12px 0 0;color:var(--muted);max-width:34em}
.block{margin-top:26px}
.bhead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.bhead h2{font-size:19px;font-weight:700}
.links{display:flex;gap:14px}
.link{background:none;border:0;padding:6px 0;color:var(--cobalt);font-size:15px}
.link.danger{color:var(--no)}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.unit{display:flex;align-items:center;gap:10px;text-align:left;padding:12px 12px;border-radius:12px;
  background:var(--surface);border:1.5px solid var(--line);min-height:54px}
.unit .uname{flex:1;font-size:15.5px;line-height:1.25}
.unit .ucount{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.unit:not(.on){opacity:.55}
.unit:not(.on) .pill{filter:grayscale(1)}
.unit.on{border-color:var(--cobalt)}
.types{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.trow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:13px 16px;background:none;border:0;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.trow .tl{flex:1;display:flex;flex-direction:column}
.trow small{color:var(--muted);font-size:13.5px}
.trow .tc{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.check{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);flex:none;position:relative}
.trow.on .check{background:var(--cobalt);border-color:var(--cobalt)}
.trow.on .check::after{content:"";position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid var(--cobalt-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.segs{display:flex;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:3px}
.seg{flex:1;padding:10px 0;border:0;background:none;border-radius:9px;font-variant-numeric:tabular-nums}
.seg.on{background:var(--ink);color:var(--bg);font-weight:600}
.toggle{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:15.5px;color:var(--muted)}
.toggle input{width:20px;height:20px;accent-color:var(--cobalt)}
.actions{margin-top:28px;display:flex;flex-direction:column;gap:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.primary{width:100%;padding:17px;border:0;border-radius:14px;background:var(--cobalt);color:var(--cobalt-ink);font-size:18px;font-weight:700}
.primary:disabled{background:var(--line);color:var(--muted)}
.secondary{padding:15px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:600}
.secondary b{color:var(--no);margin-left:4px}
.secondary:disabled{opacity:.5}
.stats{display:flex;flex-direction:column;gap:9px}
.srow{display:grid;grid-template-columns:minmax(0,1.4fr) 2fr 44px 48px;align-items:center;gap:10px;font-size:14.5px}
.sname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:var(--amber)}
.sp{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.sn{text-align:right;color:var(--muted);font-size:13px}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.th{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 6px 10px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:14px}
.th.on{border-color:var(--cobalt);box-shadow:inset 0 0 0 1px var(--cobalt)}
.sw{width:44px;height:28px;border-radius:14px;border:1px solid rgba(0,0,0,.12);display:flex;overflow:hidden}
.sw i{flex:1}
.foot{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px}

/* 퀴즈 */
.qtop{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.icon{width:42px;height:42px;border-radius:21px;border:1.5px solid var(--line);background:var(--surface);font-size:17px;flex:none}
.prog{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.prog span{display:block;height:100%;background:var(--cobalt);transition:width .3s}
.count{font:700 20px/1 var(--name);font-variant-numeric:tabular-nums}
.count small{color:var(--muted);font-weight:500}
.qcard{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:22px 20px 20px}
.qmeta{display:flex;align-items:center;flex-wrap:wrap;gap:8px;color:var(--muted);font-size:14px}
.kind{border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:12.5px}
.kind.w{color:var(--no);border-color:var(--no)}
.stem{margin:16px 0 18px;font-size:21px;line-height:1.5;font-weight:600;word-break:keep-all}
.stem .dn{font:700 34px/1.1 var(--name);letter-spacing:.005em;display:inline-block;margin-right:2px}
.stem .hl{background:var(--hl);padding:1px 6px;border-radius:5px;font-weight:700}
.stem .sig{display:block;margin-top:12px;padding:12px 14px;border-left:4px solid var(--amber);background:var(--hl);border-radius:0 8px 8px 0;font-weight:500;font-size:18.5px}
.opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.opt{width:100%;display:flex;align-items:flex-start;gap:12px;text-align:left;padding:14px 15px;border-radius:13px;
  border:1.5px solid var(--line);background:var(--bg);font-size:17px;line-height:1.45;min-height:56px;transition:background .15s,border-color .15s}
.opt .num{font-size:20px;line-height:1.2;color:var(--muted);flex:none}
.opt .ot{flex:1;word-break:keep-all;overflow-wrap:anywhere}
@media (hover:hover){.opt:not(:disabled):hover{border-color:var(--cobalt)}}
.opt:not(:disabled):active{transform:scale(.99)}
.opt.correct{background:var(--ok-bg);border-color:var(--ok)}
.opt.correct .num{color:var(--ok)}
.opt.wrong{background:var(--no-bg);border-color:var(--no)}
.opt.wrong .num{color:var(--no)}
.opt.dim{opacity:.5}
.opt:disabled{color:var(--ink)}
#fb:empty{display:none}
#fb{margin-top:18px}
.verdict{font-weight:700;font-size:19px;margin-bottom:10px}
.verdict.ok{color:var(--ok)}.verdict.no{color:var(--no)}
.expl{padding:13px 15px;border-radius:12px;background:var(--bg);font-size:16px;line-height:1.6;word-break:keep-all}
.note{margin:10px 2px 0;color:var(--muted);font-size:15px}
.next{margin-top:16px}
.score{text-align:center;color:var(--muted);font-size:14px;margin-top:14px;font-variant-numeric:tabular-nums}

/* 약물 카드 */
.dcard{padding:14px 15px;border-radius:12px;background:var(--bg);margin-top:10px}
.dtitle{color:var(--muted);font-size:13px;margin-bottom:2px}
.dname{font:700 24px/1.2 var(--name);display:flex;align-items:center;gap:8px}
.dcard dl{display:grid;grid-template-columns:44px 1fr;gap:4px 10px;margin:8px 0 0;font-size:15.5px;line-height:1.5}
.dcard dt{color:var(--muted)}
.dcard dd{margin:0;word-break:keep-all}

/* 결과 */
.res-head{padding:24px 0 6px}
.big{font:700 84px/1 var(--name);font-variant-numeric:tabular-nums}
.big small{font-size:40px;color:var(--muted)}
.res-head p{color:var(--muted);margin:10px 0 0}
.wlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.wlist li{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 15px}
.wq{font-weight:600;margin-bottom:8px;word-break:keep-all}
.wq .dn{font:700 22px var(--name)}
.wq .sig{display:block;font-weight:500;margin-top:4px;color:var(--muted)}
.wa{font-size:15.5px;margin-top:4px;display:flex;gap:8px;align-items:baseline}
.tag{flex:none;font-size:12px;padding:1px 7px;border-radius:6px;font-weight:600}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.no{background:var(--no-bg);color:var(--no)}

/* 사전 */
.dhead{font-size:22px}
.search{width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;-webkit-appearance:none}
.chips{display:flex;gap:7px;overflow-x:auto;padding:12px 0 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);font-size:14.5px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dlist .dcard{background:var(--surface);border:1.5px solid var(--line)}
.empty{color:var(--muted);padding:30px 0;text-align:center}

/* ───── 서술형 */
.hint{color:var(--muted);font-size:13px}
.qrow .tl b{font-size:16px}
.qrow .tl small{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.qno{font-weight:500;color:var(--muted);font-size:13px;margin-left:4px}
.qbest{min-width:40px;text-align:right;font:700 20px/1 var(--name);font-variant-numeric:tabular-nums;color:var(--muted)}
.qbest.hi{color:var(--ok)}.qbest.mid{color:var(--amber)}.qbest.lo{color:var(--no)}
.unit:disabled{opacity:.4}
.unit .uname{min-width:0;overflow-wrap:anywhere}
.stem .pts{font-size:15px;color:var(--muted);font-weight:500}
.jok{margin:-8px 0 14px;color:var(--muted);font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ans{width:100%;min-height:240px;resize:vertical;padding:14px 15px;border-radius:13px;border:1.5px solid var(--line);
  background:var(--bg);color:var(--ink);font:17px/1.65 var(--body);-webkit-appearance:none}
.ans:focus{outline:3px solid var(--cobalt);outline-offset:1px;border-color:var(--cobalt)}
.ans::placeholder{color:var(--muted)}
.ameta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin:6px 2px 0;font-variant-numeric:tabular-nums}
.gbtns,.nbtns{margin-top:14px}
.gbtns .primary,.nbtns .primary{padding:15px}
.sbox{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin-bottom:6px}
.sval{font:700 56px/1 var(--name);font-variant-numeric:tabular-nums}
.sval small{font-size:22px;color:var(--muted)}
.sval.hi{color:var(--ok)}.sval.mid{color:var(--amber)}.sval.lo{color:var(--no)}
.smeta{min-width:0}.smeta p{margin:8px 0 0;color:var(--muted);font-size:14.5px}
.bar.big{height:12px;border-radius:6px}
.bar span.hi{background:var(--ok)}.bar span.mid{background:var(--amber)}.bar span.lo{background:var(--no)}
.rh{margin-top:18px}
.rubs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.rub{width:100%;display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:start;text-align:left;padding:11px 13px;border-radius:12px;
  border:1.5px solid var(--line);background:var(--bg);font-size:15.5px;line-height:1.45}
.rub .mk{width:24px;height:24px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:var(--no-bg);color:var(--no)}
.rub.hit{background:var(--ok-bg);border-color:var(--ok)}
.rub.hit .mk{background:var(--ok);color:var(--surface)}
.rub.man .mk{outline:2px dashed var(--amber);outline-offset:1px}
.rub .rt{word-break:keep-all}
.rub .rt small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px;word-break:break-all}
.rw{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
details.model{margin-top:16px;border:1.5px solid var(--line);border-radius:13px;background:var(--bg);overflow:hidden}
details.model>summary{cursor:pointer;list-style:none;padding:13px 15px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
details.model>summary::-webkit-details-marker{display:none}
details.model>summary::after{content:"펼치기";font-size:13px;font-weight:500;color:var(--muted)}
details.model[open]>summary::after{content:"접기"}
.mbody{padding:4px 16px 16px;border-top:1px solid var(--line);font-size:16px;line-height:1.7;word-break:keep-all;min-width:0}
.mbody h4{margin:16px 0 6px;font-size:15px;color:var(--cobalt)}
.mbody ol,.mbody ul{margin:6px 0;padding-left:22px}
.mbody li{margin:3px 0}
.mbody p{margin:10px 0}
.mbody .src{font-size:13px;color:var(--muted)}
.mbody .tipline{font-size:14px;color:var(--muted)}
.mbody .tbl{overflow-x:auto;margin:10px 0;-webkit-overflow-scrolling:touch}
.mbody table{border-collapse:collapse;width:100%;min-width:460px;font-size:14.5px;line-height:1.5}
.mbody th,.mbody td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.mbody th{background:var(--surface)}
.mbody .callout,.tipbox{margin-top:12px;padding:11px 13px;border-radius:10px;background:var(--hl);font-size:14.5px;line-height:1.6}
.dlist .dcard{display:flex;flex-direction:column;gap:2px;margin-top:12px}
.dlist .dname{font:600 18px/1.5 var(--body);margin-top:8px}
.dlist .jok{margin:4px 0 0}
.dlist details.model{margin-top:10px;background:var(--bg)}
.solo{margin-top:12px;align-self:flex-start;padding:11px 16px}
.wq .pill{vertical-align:middle;margin-right:4px}
@media (max-width:520px){ .sval{font-size:44px} .ans{min-height:200px} }

@media (max-width:520px){
  #app{padding:18px 16px 40px}
  .home-head h1{font-size:36px}
  .stem{font-size:19px}.stem .dn{font-size:30px}
  .srow{grid-template-columns:1fr 1.2fr 40px;}.sn{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* 과목 전환 메뉴 */
.subj{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;margin:0 0 22px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line)}
.sbtn{display:flex;align-items:baseline;justify-content:center;gap:7px;padding:11px 8px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:16px;line-height:1.2;min-height:44px}
.sbtn small{color:var(--muted);font-size:13px}
.sbtn.on{background:var(--cobalt);color:var(--cobalt-ink)}
.sbtn.on small{color:inherit;opacity:.8}
a.sbtn:active{background:var(--bg)}
@media (hover:hover){a.sbtn:hover{background:var(--bg)}}

</style>
</head>
<body>
<main id="app"></main>
<script>
const CURRENT_SUBJECT = "micro";
// ───── 공용: 과목 전환 · 화면 색 · 마지막으로 연 과목
// 각 과목 앱(pharm/, micro/)이 같은 저장공간을 쓰므로 여기 값은 서로 공유된다.
const HUB_KEY = "study-hub-v1";
const SUBJECTS = [
  { id: "pharm", path: "pharm", label: "약리학", sub: "객관식" },
  { id: "micro", path: "micro", label: "미생물", sub: "서술형" }
];
const hub = (() => {
  let h = null;
  try { h = JSON.parse(localStorage.getItem(HUB_KEY)); } catch (e) {}
  return h || {};
})();
function hubSave() { try { localStorage.setItem(HUB_KEY, JSON.stringify(hub)); } catch (e) {} }

// 예전 앱별 화면 색 설정을 한 번만 옮겨 온다
if (!hub.theme) {
  for (const k of ["cns-quiz-v1", "micro-essay-v1"]) {
    try { const t = JSON.parse(localStorage.getItem(k)).set.theme; if (t) { hub.theme = t; break; } } catch (e) {}
  }
  hub.theme = hub.theme || "auto";
}
hub.last = CURRENT_SUBJECT;
hubSave();

function getTheme() { return hub.theme || "auto"; }
function setTheme(t) { hub.theme = t; hubSave(); }

function subjectSwitcher() {

function norm(s) {
  return String(s || "").toLowerCase()
    .replace(/[−–—]/g, "-")
    .replace(/\s+/g, "")
    .replace(/[.,·•:;'"`!?\[\]{}<>~]/g, "");
}
function hitRubric(item, text) {
  return item.k.every(group => group.some(alt => text.includes(norm(alt))));
}
function gradeText(q, raw) {
  const t = norm(raw);
  return q.rubric.map(r => hitRubric(r, t));
}
function totalW(q) { return q.rubric.reduce((a, r) => a + r.w, 0); }
function scoreOf(q, hits) {
  const got = q.rubric.reduce((a, r, i) => a + (hits[i] ? r.w : 0), 0);
  return Math.round(got / totalW(q) * 100);
}
function toPts(q, s) { return q.pts ? (Math.round(s / 100 * q.pts * 2) / 2).toFixed(1) : null; }
function band(s) { return s >= 80 ? "hi" : s >= 50 ? "mid" : "lo"; }
function rubricHint(r) { return r.k.map(g => g.slice(0, 3).join(" / ")).join(" + "); }

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

  ["light", "밝게", ["#EEF1F4", "#2848A0"]],
  ["dark", "어둡게", ["#14181D", "#6F8EF0"]],
  ["mint", "민트", ["#E6F2EE", "#1D7A63"]],
  ["lavender", "라벤더", ["#EEECF7", "#5847C2"]],
  ["paper", "종이", ["#F2EBDD", "#8A5528"]]
];
function applyTheme() {
  const t = getTheme();
  if (t === "auto") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = t;
  const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => {
    if (!m.dataset.orig) m.dataset.orig = m.getAttribute("content");
    m.setAttribute("content", t === "auto" ? m.dataset.orig : bg);
  });
}
applyTheme();

const $ = s => document.querySelector(s);
const app = () => $("#app");
const ALL_UNITS = Object.keys(UNITS).map(Number);
let session = null;
const smooth = () => matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth";

// ───── 홈
function poolFor(units) { return ESSAYS.filter(q => units.has(q.lec)); }
function renderHome() {
  session = null;
  const s = state.set;
  const units = new Set(s.units);
  const pool = poolFor(units);
  const low = ESSAYS.filter(q => { const b = best(q.id); return b !== null && b < 80; });
  const done = ESSAYS.filter(q => best(q.id) !== null).length;

  const unitBtns = ALL_UNITS.map(u => {
    const n = ESSAYS.filter(q => q.lec === u).length;
    return `<button class="unit ${units.has(u) ? "on" : ""}" data-u="${u}" aria-pressed="${units.has(u)}" ${n ? "" : "disabled"}>
      <span class="pill"><i>${u}</i></span><span class="uname">${UNITS[u]}</span><span class="ucount">${n || "출제 없음"}</span></button>`;
  }).join("");

  const qrows = pool.map(q => {
    const b = best(q.id);
    return `<button class="trow qrow" data-id="${q.id}">
      <span class="pill sm"><i>${q.lec}</i></span>
      <span class="tl"><b>${esc(SHORT[q.id])} <span class="qno">${q.no}${q.pts ? ` · ${q.pts}점` : ""}</span></b><small>${esc(q.stem)}</small></span>
      <span class="qbest ${b === null ? "" : band(b)}">${b === null ? "—" : b}</span></button>`;
  }).join("");

  const orders = [["seq", "순서대로"], ["rand", "무작위"], ["low", "낮은 점수 먼저"]].map(([k, l]) =>
    `<button class="seg ${s.order === k ? "on" : ""}" data-o="${k}">${l}</button>`).join("");

  app().innerHTML = `
  ${subjectSwitcher()}
  <header class="home-head">
    <h1>미생물<br>서술형 문제</h1>
    <p class="lede">조정제 교수님 기말 서술형 족보 ${ESSAYS.length}문항. 답을 직접 타이핑하면 강의록 핵심 키워드로 채점하고, 빠진 항목과 모범답안을 보여 줍니다.</p>
  </header>

  <section class="block">
    <div class="bhead"><h2>단원</h2>
      <span class="links"><button class="link" id="allU">전체 선택</button><button class="link" id="noneU">모두 해제</button></span></div>
    <div class="units">${unitBtns}</div>
  </section>

  <section class="block">
    <div class="bhead"><h2>문항</h2><span class="hint">최고점 · 눌러서 한 문항만 풀기</span></div>
    <div class="types">${qrows || `<p class="empty">단원을 골라 주세요.</p>`}</div>
  </section>

  <section class="block">
    <div class="bhead"><h2>푸는 순서</h2></div>
    <div class="segs">${orders}</div>
  </section>

  <div class="actions">
    <button class="primary" id="start" ${pool.length ? "" : "disabled"}>${pool.length ? `${pool.length}문항 풀기` : "단원을 골라 주세요"}</button>
    <div class="row2">
      <button class="secondary" id="lowBtn" ${low.length ? "" : "disabled"}>80점 미만 다시 <b>${low.length}</b></button>
      <button class="secondary" id="dictBtn">모범답안 모음</button>
    </div>
  </div>

  <section class="block">
    <div class="bhead"><h2>화면 색</h2></div>
    <div class="themes">${THEMES.map(([k, label, c]) => `<button class="th ${getTheme() === k ? "on" : ""}" data-th="${k}" aria-pressed="${getTheme() === k}">
      <span class="sw">${c ? `<i style="background:${c[0]}"></i><i style="background:${c[1]}"></i>` : `<i style="background:#EEF1F4"></i><i style="background:#14181D"></i>`}</span>${label}</button>`).join("")}</div>
  </section>

  ${renderStats()}

  <footer class="foot">
    <span>풀어 본 문항 ${done} / ${ESSAYS.length}</span>
    <button class="link danger" id="reset">학습 기록 지우기</button>
  </footer>`;

  app().querySelectorAll(".unit").forEach(b => b.onclick = () => {
    const u = +b.dataset.u; const set = new Set(state.set.units);
    set.has(u) ? set.delete(u) : set.add(u);
    state.set.units = [...set].sort((a, b) => a - b); save(); renderHome();
  });
  app().querySelectorAll(".qrow").forEach(b => b.onclick = () => startQuiz([BYID[b.dataset.id]], "one"));
  app().querySelectorAll(".seg").forEach(b => b.onclick = () => { state.set.order = b.dataset.o; save(); renderHome(); });
  app().querySelectorAll(".th").forEach(b => b.onclick = () => { setTheme(b.dataset.th); applyTheme(); renderHome(); });
  $("#allU").onclick = () => { state.set.units = ALL_UNITS.slice(); save(); renderHome(); };
  $("#noneU").onclick = () => { state.set.units = []; save(); renderHome(); };
  $("#start").onclick = () => startQuiz(pool, "normal");
  $("#lowBtn").onclick = () => startQuiz(low, "low");
  $("#dictBtn").onclick = () => renderDict();
  $("#reset").onclick = () => {
    if (confirm("채점 기록을 모두 지울까요? 작성 중인 답안과 설정은 남아요.")) { state.q = {}; save(); renderHome(); }
  };
  window.scrollTo(0, 0);
}

function renderStats() {
  const rows = ALL_UNITS.map(u => {
    const qs = ESSAYS.filter(q => q.lec === u && best(q.id) !== null);
    if (!qs.length) return null;
    const avg = Math.round(qs.reduce((a, q) => a + best(q.id), 0) / qs.length);
    const n = qs.reduce((a, q) => a + state.q[q.id].length, 0);
    return { u, avg, n };
  }).filter(Boolean);
  if (!rows.length) return "";
  return `<section class="block">
    <div class="bhead"><h2>단원별 최고점 평균</h2></div>
    <div class="stats">${rows.map(r => `<div class="srow"><span class="sname">${r.u}. ${UNITS[r.u]}</span>
      <span class="bar"><span style="width:${r.avg}%"></span></span><span class="sp">${r.avg}</span><span class="sn">${r.n}회</span></div>`).join("")}</div></section>`;
}

// ───── 문제 풀기
function startQuiz(list, mode) {
  if (!list.length) return;
  let items = list.slice();
  if (mode === "normal") {
    if (state.set.order === "rand") items = shuffle(items);
    else if (state.set.order === "low") items = items.map(q => ({ q, k: (best(q.id) ?? -1) + Math.random() })).sort((a, b) => a.k - b.k).map(x => x.q);
  }
  session = { mode, items, i: 0, log: [], graded: null };
  renderQ();
}

function renderQ() {
  if (session.i >= session.items.length) return renderResult();
  const q = session.items[session.i];
  const total = session.items.length, idx = session.i;
  session.graded = null;
  const b = best(q.id);
  app().innerHTML = `
  <div class="qtop">
    <button class="icon" id="quit" aria-label="그만 풀기">✕</button>
    <div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${idx}"><span style="width:${idx / total * 100}%"></span></div>
    <span class="count">${idx + 1}<small>/${total}</small></span>
  </div>
  <article class="qcard">
    <div class="qmeta"><span class="pill sm"><i>${q.lec}</i></span><span>${UNITS[q.lec]}</span><span class="kind">서술 ${q.no}</span><span class="kind">${esc(q.jokbo.split(" · ")[0])}</span>${b !== null ? `<span class="kind">최고 ${b}</span>` : ""}</div>
    <h2 class="stem">${esc(q.stem)}${q.pts ? ` <span class="pts">(${q.pts}점)</span>` : ""}</h2>
    <p class="jok">${esc(q.jokbo)}</p>
    <label class="sr" for="ans">내 답안</label>
    <textarea id="ans" class="ans" placeholder="시험장에서 쓰듯 적어 보세요. 의학용어는 영어·한글 모두 인식해요." autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">${esc(state.draft[q.id] || "")}</textarea>
    <div class="ameta"><span id="cc">0자</span><span>자동 저장 · ⌘/Ctrl + Enter로 채점</span></div>
    <div class="row2 gbtns">
      <button class="primary" id="grade">채점하기</button>
      <button class="secondary" id="peek">모범답안 보기</button>
    </div>
    <div id="fb"></div>
  </article>`;
  const ta = $("#ans"), cc = $("#cc");
  const upd = () => { cc.textContent = ta.value.replace(/\s/g, "").length + "자"; };
  upd();
  ta.oninput = () => { state.draft[q.id] = ta.value; save(); upd(); };
  $("#grade").onclick = () => grade(q);
  $("#peek").onclick = () => showFeedback(q, null);
  $("#quit").onclick = () => {
    if (!session.log.length || confirm("지금까지 채점한 기록은 저장돼요. 그만 풀까요?")) session.log.length ? renderResult() : renderHome();
  };
  window.scrollTo(0, 0);
}

function grade(q) {
  const raw = $("#ans").value;
  if (!raw.trim()) { $("#fb").innerHTML = `<p class="note">답안을 먼저 적어 주세요. 모르겠으면 ‘모범답안 보기’를 누르세요.</p>`; return; }
  const hits = gradeText(q, raw);
  const s = scoreOf(q, hits);
  const h = state.q[q.id] || (state.q[q.id] = []);
  if (session.graded && session.graded.q === q) h[h.length - 1] = { s, t: Date.now() };
  else h.push({ s, t: Date.now() });
  if (h.length > 30) state.q[q.id] = h.slice(-30);
  save();
  session.graded = { q, auto: hits.slice(), cur: hits.slice() };
  const logged = session.log.find(l => l.q === q);
  if (logged) logged.s = s; else session.log.push({ q, s });
  showFeedback(q, session.graded);
}

function showFeedback(q, g) {
  const lastQ = session.i + 1 >= session.items.length;
  let top = "";
  if (g) {
    const s = scoreOf(q, g.cur), autoS = scoreOf(q, g.auto);
    const miss = g.cur.filter(x => !x).length;
    top = `
    <div class="sbox">
      <div class="sval ${band(s)}">${s}<small>/100</small></div>
      <div class="smeta">
        <div class="bar big"><span class="${band(s)}" style="width:${s}%"></span></div>
        <p>${miss ? `빠진 항목 ${miss}개` : "모든 채점 항목 포함"}${q.pts ? ` · ${q.pts}점 만점 환산 <b>${toPts(q, s)}점</b>` : ""}${s !== autoS ? ` · 자동 채점 ${autoS}점에서 수정` : ""}</p>
      </div>
    </div>
    <div class="bhead rh"><h2>채점 항목</h2><span class="hint">뜻이 맞으면 눌러서 인정 / 취소</span></div>
    <ul class="rubs">${q.rubric.map((r, i) => `<li><button class="rub ${g.cur[i] ? "hit" : ""} ${g.cur[i] !== g.auto[i] ? "man" : ""}" data-i="${i}" aria-pressed="${g.cur[i]}">
      <span class="mk">${g.cur[i] ? "✓" : "✕"}</span>
      <span class="rt">${esc(r.t)}${g.cur[i] ? "" : `<small>인식 키워드: ${esc(rubricHint(r))}</small>`}</span>
      <span class="rw">${r.w}</span></button></li>`).join("")}</ul>`;
  }
  $("#fb").innerHTML = `${top}
    <details class="model" ${g ? "" : "open"}><summary>모범답안 · 해설</summary>
      <div class="mbody">${q.model}<div class="tipbox">💡 ${esc(q.tip)}</div></div></details>
    <div class="row2 nbtns">
      ${g ? `<button class="secondary" id="regrade">답안 고쳐서 다시 채점</button>` : `<button class="secondary" id="backAns">답안 쓰러 가기</button>`}
      <button class="primary" id="next">${lastQ ? "결과 보기" : "다음 문항"}</button>
    </div>`;
  if (g) app().querySelectorAll(".rub").forEach(b => b.onclick = () => {
    const i = +b.dataset.i; g.cur[i] = !g.cur[i];
    const s = scoreOf(q, g.cur);
    const h = state.q[q.id]; if (h && h.length) { h[h.length - 1].s = s; save(); }
    const l = session.log.find(x => x.q === q); if (l) l.s = s;
    const open = $("#fb details.model").open, y = window.scrollY;
    showFeedback(q, g);
    $("#fb details.model").open = open; window.scrollTo(0, y);
  });
  const rg = $("#regrade"), ba = $("#backAns");
  if (rg) rg.onclick = () => { const ta = $("#ans"); ta.focus(); ta.scrollIntoView({ behavior: smooth(), block: "center" }); };
  if (ba) ba.onclick = () => { const ta = $("#ans"); ta.focus(); ta.scrollIntoView({ behavior: smooth(), block: "center" }); };
  $("#next").onclick = () => { if (!session.log.find(l => l.q === q)) session.log.push({ q, s: null }); session.i++; renderQ(); };
  $("#fb").scrollIntoView({ behavior: smooth(), block: "start" });
}

// ───── 결과
function renderResult() {
  const log = session.log;
  const scored = log.filter(l => l.s !== null);
  const avg = scored.length ? Math.round(scored.reduce((a, l) => a + l.s, 0) / scored.length) : 0;
  const lows = log.filter(l => l.s === null || l.s < 80).map(l => l.q);
  app().innerHTML = `
  <header class="res-head">
    <div class="big">${scored.length ? avg : "—"}<small>${scored.length ? "/100" : ""}</small></div>
    <p>${scored.length ? `채점한 ${scored.length}문항 평균` : "채점한 문항이 없어요"}${lows.length ? ` · 80점 미만·미채점 ${lows.length}문항` : " · 모두 80점 이상"}</p>
  </header>
  <div class="actions">
    ${lows.length ? `<button class="primary" id="retry">${lows.length}문항 다시 쓰기</button>` : ""}
    <div class="row2">
      <button class="secondary" id="again">처음부터 다시</button>
      <button class="secondary" id="home">처음으로</button>
    </div>
  </div>
  <section class="block"><div class="bhead"><h2>이번 점수</h2></div>
    <ol class="wlist">${log.map(l => `<li>
      <div class="wq"><span class="pill sm"><i>${l.q.lec}</i></span> ${esc(l.q.stem)}</div>
      <div class="wa"><span class="tag ${l.s === null ? "no" : l.s >= 80 ? "ok" : "no"}">${l.s === null ? "미채점" : l.s + "점"}</span>${l.q.pts && l.s !== null ? `${l.q.pts}점 만점 환산 ${toPts(l.q, l.s)}점 · ` : ""}최고 ${best(l.q.id) ?? "—"}</div>
    </li>`).join("")}</ol></section>`;
  const r = $("#retry");
  if (r) r.onclick = () => startQuiz(lows, "retry");
  $("#again").onclick = () => startQuiz(session.items, session.mode === "one" ? "one" : "normal");
  $("#home").onclick = () => renderHome();
  window.scrollTo(0, 0);
}

// ───── 모범답안 모음
let dictUnit = 0, dictQ = "";
function renderDict() {
  session = null;
  const chips = [0, ...ALL_UNITS.filter(u => ESSAYS.some(q => q.lec === u))].map(u =>
    `<button class="chip ${dictUnit === u ? "on" : ""}" data-u="${u}">${u ? u + ". " + UNITS[u] : "전체"}</button>`).join("");
  app().innerHTML = `
  <div class="qtop"><button class="icon" id="back" aria-label="처음으로">✕</button><h2 class="dhead">모범답안 모음</h2></div>
  <input class="search" id="q" type="search" placeholder="문항·키워드로 찾기 (예: syncytia, 가다실)" value="${esc(dictQ)}" autocomplete="off" autocapitalize="off" spellcheck="false">
  <div class="chips">${chips}</div>
  <div id="dlist" class="dlist"></div>`;
  $("#back").onclick = () => renderHome();
  app().querySelectorAll(".chip").forEach(b => b.onclick = () => { dictUnit = +b.dataset.u; renderDict(); });
  const q = $("#q");
  q.oninput = () => { dictQ = q.value; fillDict(); };
  fillDict();
}
function fillDict() {
  const t = dictQ.trim().toLowerCase();
  const list = ESSAYS.filter(q => (!dictUnit || q.lec === dictUnit) &&
    (!t || [q.stem, q.model.replace(/<[^>]+>/g, " "), q.rubric.map(r => r.t).join(" ")].join(" ").toLowerCase().includes(t)));
  $("#dlist").innerHTML = list.length ? list.map(q => `
    <article class="dcard">
      <div class="qmeta"><span class="pill sm"><i>${q.lec}</i></span><span>${UNITS[q.lec]}</span><span class="kind">서술 ${q.no}</span>${q.pts ? `<span class="kind">${q.pts}점</span>` : ""}</div>
      <div class="dname">${esc(q.stem)}</div>
      <p class="jok">${esc(q.jokbo)}</p>
      <details class="model"><summary>모범답안 · 해설</summary><div class="mbody">${q.model}<div class="tipbox">💡 ${esc(q.tip)}</div></div></details>
      <details class="model"><summary>채점 항목 ${q.rubric.length}개</summary><div class="mbody"><ol>${q.rubric.map(r => `<li>${esc(r.t)} <span class="rw">· ${r.w}</span></li>`).join("")}</ol></div></details>
      <button class="secondary solo" data-id="${q.id}">이 문항 풀기</button>
    </article>`).join("")
    : `<p class="empty">“${esc(dictQ)}”가 들어간 문항이 없어요. 다른 키워드나 ‘전체’ 단원으로 찾아 보세요.</p>`;
  app().querySelectorAll(".solo").forEach(b => b.onclick = () => startQuiz([BYID[b.dataset.id]], "one"));
}

// ───── 키보드 (아이패드 키보드 연결 시)
document.addEventListener("keydown", e => {
  if (!session) return;
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
    e.preventDefault();
    const q = session.items[session.i];
    if (!q) return;
    if (document.activeElement && document.activeElement.id === "ans") grade(q);
    else if ($("#next")) $("#next").click();
  }
});

renderHome();

registerSW();

</script>
</body>
</html>
