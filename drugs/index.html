<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CNS 약물 암기</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="약리·미생물">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF1F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14181D" media="(prefers-color-scheme: dark)">
<script>try{var h=JSON.parse(localStorage.getItem("study-hub-v1"))||{},t=h.theme;if(t&&t!=="auto")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" href="../icon-180.png">
<link rel="manifest" href="../manifest.json">
<style>
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --ink:#16212B; --muted:#5B6874; --line:#D5DCE2;
  --cobalt:#2848A0; --cobalt-ink:#FFFFFF; --amber:#E7A532; --amber-ink:#3A2A06;
  --ok:#23784A; --ok-bg:#E3F2E8; --no:#B93A2B; --no-bg:#FBE7E3; --hl:#FFF1D2;
  --name:"Avenir Next Condensed","Avenir Next","Arial Narrow","Helvetica Neue",sans-serif;
  --body:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
}
/* 화면 색: 자동(기기 설정) · 밝게 · 어둡게 · 민트 · 라벤더 · 종이 */
@media (prefers-color-scheme: dark){
  :root:not([data-theme]), :root[data-theme="auto"]{ --bg:#14181D; --surface:#1D232A; --ink:#E7ECF0; --muted:#9AA6B1; --line:#323B45;
    --cobalt:#6F8EF0; --cobalt-ink:#0C1530; --amber:#E9B04A; --amber-ink:#2A1D03;
    --ok:#62C28A; --ok-bg:#183326; --no:#F08273; --no-bg:#3A1D19; --hl:#3A3220; }
}
:root[data-theme="dark"]{ --bg:#14181D; --surface:#1D232A; --ink:#E7ECF0; --muted:#9AA6B1; --line:#323B45;
    --cobalt:#6F8EF0; --cobalt-ink:#0C1530; --amber:#E9B04A; --amber-ink:#2A1D03;
    --ok:#62C28A; --ok-bg:#183326; --no:#F08273; --no-bg:#3A1D19; --hl:#3A3220; }
:root[data-theme="mint"]{ --bg:#E6F2EE; --surface:#FFFFFF; --ink:#13302A; --muted:#55706A; --line:#C6DDD5;
  --cobalt:#1D7A63; --cobalt-ink:#FFFFFF; --amber:#E7A532; --hl:#FFF2D4; --ok-bg:#DDF0E3; --no-bg:#FBE6E2; }
:root[data-theme="lavender"]{ --bg:#EEECF7; --surface:#FFFFFF; --ink:#211D36; --muted:#625C80; --line:#D6D1EA;
  --cobalt:#5847C2; --cobalt-ink:#FFFFFF; --amber:#E89B3A; --hl:#FFF0D9; }
:root[data-theme="paper"]{ --bg:#F2EBDD; --surface:#FBF7EE; --ink:#2D2517; --muted:#6E6352; --line:#DFD3BC;
  --cobalt:#8A5528; --cobalt-ink:#FFFFFF; --amber:#4E7C5B; --hl:#F6E7C4; --ok-bg:#E3EEDB; --no-bg:#F7E1D9; }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 var(--body);
  -webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app{max-width:760px;margin:0 auto;padding:28px 20px 48px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
button:disabled{cursor:default}
h1,h2{margin:0}

/* 캡슐 배지: 단원 번호 */
.pill{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:24px;border-radius:12px;
  background:linear-gradient(90deg,var(--cobalt) 0 50%,var(--amber) 50% 100%);flex:none}
.pill i{font:700 13px/1 var(--name);font-style:normal;color:#fff;background:var(--cobalt);padding:3px 7px;border-radius:9px;letter-spacing:.02em}
.pill.sm{min-width:34px;height:18px}.pill.sm i{font-size:11px;padding:2px 5px}

/* 홈 */
.home-head{padding:8px 0 20px}
.home-head h1{font:700 44px/1.05 var(--body);letter-spacing:-.02em}
.lede{margin:12px 0 0;color:var(--muted);max-width:34em}
.block{margin-top:26px}
.bhead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.bhead h2{font-size:19px;font-weight:700}
.links{display:flex;gap:14px}
.link{background:none;border:0;padding:6px 0;color:var(--cobalt);font-size:15px}
.link.danger{color:var(--no)}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.unit{display:flex;align-items:center;gap:10px;text-align:left;padding:12px 12px;border-radius:12px;
  background:var(--surface);border:1.5px solid var(--line);min-height:54px}
.unit .uname{flex:1;font-size:15.5px;line-height:1.25}
.unit .ucount{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.unit:not(.on){opacity:.55}
.unit:not(.on) .pill{filter:grayscale(1)}
.unit.on{border-color:var(--cobalt)}
.types{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.trow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:13px 16px;background:none;border:0;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.trow .tl{flex:1;display:flex;flex-direction:column}
.trow small{color:var(--muted);font-size:13.5px}
.trow .tc{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.check{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);flex:none;position:relative}
.trow.on .check{background:var(--cobalt);border-color:var(--cobalt)}
.trow.on .check::after{content:"";position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid var(--cobalt-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.segs{display:flex;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:3px}
.seg{flex:1;padding:10px 0;border:0;background:none;border-radius:9px;font-variant-numeric:tabular-nums}
.seg.on{background:var(--ink);color:var(--bg);font-weight:600}
.toggle{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:15.5px;color:var(--muted)}
.toggle input{width:20px;height:20px;accent-color:var(--cobalt)}
.actions{margin-top:28px;display:flex;flex-direction:column;gap:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.primary{width:100%;padding:17px;border:0;border-radius:14px;background:var(--cobalt);color:var(--cobalt-ink);font-size:18px;font-weight:700}
.primary:disabled{background:var(--line);color:var(--muted)}
.secondary{padding:15px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:600}
.secondary b{color:var(--no);margin-left:4px}
.secondary:disabled{opacity:.5}
.stats{display:flex;flex-direction:column;gap:9px}
.srow{display:grid;grid-template-columns:minmax(0,1.4fr) 2fr 44px 48px;align-items:center;gap:10px;font-size:14.5px}
.sname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:var(--amber)}
.sp{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.sn{text-align:right;color:var(--muted);font-size:13px}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.th{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 6px 10px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:14px}
.th.on{border-color:var(--cobalt);box-shadow:inset 0 0 0 1px var(--cobalt)}
.sw{width:44px;height:28px;border-radius:14px;border:1px solid rgba(0,0,0,.12);display:flex;overflow:hidden}
.sw i{flex:1}
.foot{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px}

/* 퀴즈 */
.qtop{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.icon{width:42px;height:42px;border-radius:21px;border:1.5px solid var(--line);background:var(--surface);font-size:17px;flex:none}
.prog{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.prog span{display:block;height:100%;background:var(--cobalt);transition:width .3s}
.count{font:700 20px/1 var(--name);font-variant-numeric:tabular-nums}
.count small{color:var(--muted);font-weight:500}
.qcard{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:22px 20px 20px}
.qmeta{display:flex;align-items:center;flex-wrap:wrap;gap:8px;color:var(--muted);font-size:14px}
.kind{border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:12.5px}
.kind.w{color:var(--no);border-color:var(--no)}
.stem{margin:16px 0 18px;font-size:21px;line-height:1.5;font-weight:600;word-break:keep-all}
.stem .dn{font:700 34px/1.1 var(--name);letter-spacing:.005em;display:inline-block;margin-right:2px}
.stem .hl{background:var(--hl);padding:1px 6px;border-radius:5px;font-weight:700}
.stem .sig{display:block;margin-top:12px;padding:12px 14px;border-left:4px solid var(--amber);background:var(--hl);border-radius:0 8px 8px 0;font-weight:500;font-size:18.5px}
.opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.opt{width:100%;display:flex;align-items:flex-start;gap:12px;text-align:left;padding:14px 15px;border-radius:13px;
  border:1.5px solid var(--line);background:var(--bg);font-size:17px;line-height:1.45;min-height:56px;transition:background .15s,border-color .15s}
.opt .num{font-size:20px;line-height:1.2;color:var(--muted);flex:none}
.opt .ot{flex:1;word-break:keep-all;overflow-wrap:anywhere}
@media (hover:hover){.opt:not(:disabled):hover{border-color:var(--cobalt)}}
.opt:not(:disabled):active{transform:scale(.99)}
.opt.correct{background:var(--ok-bg);border-color:var(--ok)}
.opt.correct .num{color:var(--ok)}
.opt.wrong{background:var(--no-bg);border-color:var(--no)}
.opt.wrong .num{color:var(--no)}
.opt.dim{opacity:.5}
.opt:disabled{color:var(--ink)}
#fb:empty{display:none}
#fb{margin-top:18px}
.verdict{font-weight:700;font-size:19px;margin-bottom:10px}
.verdict.ok{color:var(--ok)}.verdict.no{color:var(--no)}
.expl{padding:13px 15px;border-radius:12px;background:var(--bg);font-size:16px;line-height:1.6;word-break:keep-all}
.note{margin:10px 2px 0;color:var(--muted);font-size:15px}
.next{margin-top:16px}
.score{text-align:center;color:var(--muted);font-size:14px;margin-top:14px;font-variant-numeric:tabular-nums}

/* 약물 카드 */
.dcard{padding:14px 15px;border-radius:12px;background:var(--bg);margin-top:10px}
.dtitle{color:var(--muted);font-size:13px;margin-bottom:2px}
.dname{font:700 24px/1.2 var(--name);display:flex;align-items:center;gap:8px}
.dcard dl{display:grid;grid-template-columns:44px 1fr;gap:4px 10px;margin:8px 0 0;font-size:15.5px;line-height:1.5}
.dcard dt{color:var(--muted)}
.dcard dd{margin:0;word-break:keep-all}

/* 결과 */
.res-head{padding:24px 0 6px}
.big{font:700 84px/1 var(--name);font-variant-numeric:tabular-nums}
.big small{font-size:40px;color:var(--muted)}
.res-head p{color:var(--muted);margin:10px 0 0}
.wlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.wlist li{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 15px}
.wq{font-weight:600;margin-bottom:8px;word-break:keep-all}
.wq .dn{font:700 22px var(--name)}
.wq .sig{display:block;font-weight:500;margin-top:4px;color:var(--muted)}
.wa{font-size:15.5px;margin-top:4px;display:flex;gap:8px;align-items:baseline}
.tag{flex:none;font-size:12px;padding:1px 7px;border-radius:6px;font-weight:600}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.no{background:var(--no-bg);color:var(--no)}

/* 사전 */
.dhead{font-size:22px}
.search{width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;-webkit-appearance:none}
.chips{display:flex;gap:7px;overflow-x:auto;padding:12px 0 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);font-size:14.5px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dlist .dcard{background:var(--surface);border:1.5px solid var(--line)}
.empty{color:var(--muted);padding:30px 0;text-align:center}

@media (max-width:520px){
  #app{padding:18px 16px 40px}
  .home-head h1{font-size:36px}
  .stem{font-size:19px}.stem .dn{font-size:30px}
  .srow{grid-template-columns:1fr 1.2fr 40px;}.sn{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ── 약리 퀴즈 전용 */
.hint{color:var(--muted);font-size:13px}
.ugroup+.ugroup{margin-top:16px}
.ghead{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 8px;color:var(--muted);font-size:14px}
.ghead .link{font-size:14px}
.unit .uname{font-size:15px}
.chips.wrap{flex-wrap:wrap;overflow:visible;padding-top:0}
.chip small{color:var(--muted);margin-left:2px;font-variant-numeric:tabular-nums}
.chip.on small{color:inherit;opacity:.7}
.uname-sm{font-weight:600;color:var(--ink)}
.kind.hot{border-color:var(--amber);color:var(--amber-ink);background:var(--hl)}
.mhint{margin:-6px 0 14px;color:var(--muted);font-size:14.5px}
.opt .onote{display:block;font-size:14.5px;line-height:1.45;margin-top:4px;color:var(--muted)}
.opt .onote:empty{display:none}
.opt.correct .onote{color:var(--ok)}
.opt.wrong .onote{color:var(--no)}
.opts.multi .opt{padding-right:12px}
.opt .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex:none;margin-top:1px;position:relative;background:var(--surface)}
.opt.sel{border-color:var(--cobalt);background:var(--surface)}
.opt.sel .box{background:var(--cobalt);border-color:var(--cobalt)}
.opt.sel .box::after{content:"";position:absolute;left:7px;top:3px;width:6px;height:11px;border:solid var(--cobalt-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.opt.sel.correct{background:var(--ok-bg);border-color:var(--ok)}
.opt.sel.correct .box{background:var(--ok);border-color:var(--ok)}
.opt.sel.wrong{background:var(--no-bg);border-color:var(--no)}
.opt.sel.wrong .box{background:var(--no);border-color:var(--no)}
.opt.missed{border-style:dashed}
.opt.dim .onote{opacity:1}
.checkbtn{margin-top:14px}
.checkbtn:disabled{background:var(--line);color:var(--muted)}
.expl{white-space:pre-line}
.dcard .bq{font-weight:600;margin:8px 0;word-break:keep-all;line-height:1.5}
.blist-o{list-style:none;margin:0;padding:0;font-size:15px;line-height:1.55}
.blist-o li{padding:2px 0;color:var(--muted)}
.blist-o li.ans{color:var(--ok);font-weight:600}
.bexp{margin-top:8px;font-size:15px}
.bexp summary{cursor:pointer;color:var(--cobalt);padding:4px 0}
.bexp p{margin:6px 0;word-break:keep-all}
.solo{margin-top:10px;width:100%}
@media (max-width:520px){.units{grid-template-columns:1fr 1fr}}

/* ── CNS 약물 암기 전용 */
.st{color:#E0A100;font-weight:700}
.mic{font-size:.95em}
.jk{color:#7B4FC4;font-weight:700}
.bd{display:inline-block;font-size:12px;font-weight:600;border-radius:6px;padding:1px 7px;margin-left:4px;border:1px solid var(--line);vertical-align:1px}
.st-b{color:#9A6B00;background:#FFF3C9;border-color:#F1D27A}
.jk-b{color:#6A3FB5;background:#F0E8FD;border-color:#D6C4F5}
.mic-b{color:var(--muted)}
.ok-b{color:var(--ok);border-color:var(--ok)}
.no-b{color:var(--no);border-color:var(--no)}
:root[data-theme="dark"] .st-b{background:#3A3016;color:#F0C75E;border-color:#5C4A1C}
:root[data-theme="dark"] .jk-b{background:#2C2340;color:#C8B0F2;border-color:#463767}
@media (prefers-color-scheme: dark){:root:not([data-theme]) .st-b{background:#3A3016;color:#F0C75E;border-color:#5C4A1C}:root:not([data-theme]) .jk-b{background:#2C2340;color:#C8B0F2;border-color:#463767}}
.modes{display:flex;flex-direction:column;gap:8px}
.mode{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface)}
.mode .ml{flex:1;display:flex;flex-direction:column}
.mode b{font-size:17px}.mode small{color:var(--muted);font-size:13.5px;margin-top:2px}
.mode .mn{font:700 20px/1 var(--name);color:var(--cobalt);font-variant-numeric:tabular-nums}
.mode:disabled{opacity:.45}
@media (hover:hover){.mode:not(:disabled):hover{border-color:var(--cobalt)}}
.prog3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.prog3 div{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}
.prog3 b{font:700 26px/1.1 var(--name);font-variant-numeric:tabular-nums}
.prog3 small{color:var(--muted);font-size:13px;line-height:1.3}
.flash{display:block;-webkit-user-select:none;user-select:none;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:22px 20px;min-height:340px;cursor:pointer;box-shadow:0 1px 0 var(--line)}
.flash.flipped{cursor:default;border-color:var(--cobalt)}
.flash .face{animation:fl .22s ease}
@keyframes fl{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.flash .face{animation:none}}
.fmeta{color:var(--muted);font-size:14px;margin-bottom:8px}
.fname{font:700 40px/1.15 var(--name);margin:28px 0 18px;word-break:keep-all}
.fname.sm{font-size:28px;margin:4px 0 10px}
.fhint{color:var(--muted);font-size:14.5px;margin:24px 0 0}
.fq{font-size:22px;font-weight:600;line-height:1.5;margin:26px 0 8px;word-break:keep-all}
.fq.sm{font-size:16px;margin:2px 0 10px;color:var(--muted);font-weight:500}
.fa{font-size:21px;font-weight:700;line-height:1.5;color:var(--ink);padding:12px 14px;background:var(--hl);border-radius:10px;word-break:keep-all}
.fmemo{color:var(--muted);font-size:14px;margin:10px 0 0}
.dl{margin:0;display:flex;flex-direction:column;gap:9px}
.dl .r{display:grid;grid-template-columns:88px 1fr;gap:10px;font-size:16px;line-height:1.55}
.dl dt{color:var(--muted);font-size:14px;padding-top:2px}
.dl dd{margin:0;word-break:keep-all;overflow-wrap:anywhere}
.fbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.fbtns.hidden{visibility:hidden}
.again{color:var(--no)}
.dc.againc{border-color:var(--no)}
.dcard dl.dl{display:flex;flex-direction:column;gap:8px;margin:8px 0 0;font-size:inherit}
.dlist .dcard .dl .r{font-size:15px}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.oxb{display:flex;flex-direction:column;align-items:center;gap:2px;padding:18px 10px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font:700 34px/1 var(--name)}
.oxb small{font:500 13px/1 var(--body);color:var(--muted)}
.oxb.correct{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.oxb.wrong{background:var(--no-bg);border-color:var(--no);color:var(--no)}
.oxb.dim{opacity:.45}
@media (max-width:520px){.fname{font-size:32px}.dl .r{grid-template-columns:1fr;gap:0}.dl dt{font-size:13px}.prog3 b{font-size:22px}}

/* ── 약물 리스트 타이핑 */

const HUB_KEY = "study-hub-v1";
const SUBJECTS = [
  { id: "pharm", path: "pharm", label: "약리학", sub: "객관식" },

];
const hub = (() => {
  let h = null;
  try { h = JSON.parse(localStorage.getItem(HUB_KEY)); } catch (e) {}
  return h || {};
})();
function hubSave() { try { localStorage.setItem(HUB_KEY, JSON.stringify(hub)); } catch (e) {} }

if (!hub.theme) {

  }
  hub.theme = hub.theme || "auto";
}
hub.last = CURRENT_SUBJECT;
hubSave();

function getTheme() { return hub.theme || "auto"; }

    s.id === cur

}

  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {

// ───── 데이터 정리
function hash(s) {
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
  return (h >>> 0).toString(36);
}
const CARDS = DRUGS.map(r => ({
  id: "d:" + hash(r[0] + "|" + r[1]), kind: "drug", u: r[0], name: r[1], cls: r[2], mech: r[3], use: r[4], ae: r[5], pt: r[6],
  star: r[7].includes("★"), jok: r[7].includes("족"), mic: r[7].includes("🎙")
}));
const PAIR_CARDS = PAIRS.map(r => ({
  id: "p:" + hash(r[1] + "|" + r[2]), kind: "pair", u: r[0], set: r[1], front: r[2], back: r[3], memo: r[4],
  star: /★/.test(r[4]), jok: /개년|매년|중간|기말|서술|%/.test(r[4]), mic: false
}));
const TFS = TF.map(r => ({ id: "t:" + r[1], u: r[0], n: r[1], q: r[2], t: r[3], e: r[4] }));
const BYID = Object.fromEntries([...CARDS, ...PAIR_CARDS, ...TFS].map(c => [c.id, c]));
const ALL_UNITS = Object.keys(SECTIONS);

const MODES = {
  browse: { label: "약물 카드 훑어보기", desc: "단원별 약물 프로필 — 검색 가능" },
  d2i: { label: "약물 → 정보", desc: "약 이름을 보고 기전·용도·부작용 떠올리기" },
  i2d: { label: "기전·용도 → 약물", desc: "단서를 보고 약 이름 맞히기" },
  pair: { label: "핵심 짝 카드", desc: "시험 직전 30초 · 상황→약 · 부작용·해독제 역검색" },
  tf: { label: "T/F 함정 문항", desc: `요약본의 ${TFS.length}문항, O/X로 바로 채점` },
  type: { label: "약물 리스트 타이핑", desc: "종류별 약물 리스트의 빈칸에 약 이름을 직접 입력" }
};

const STORE_KEY = "drugs-study-v1";
const state = (() => {
  let s = null;

  s = s || {};
  s.k = s.k || {};      // 카드 id → 1(알았음) / 0(다시)
  s.tf = s.tf || {};    // T/F id → [맞음, 틀림]
  s.ty = s.ty || {};    // 타이핑 칸 id → 1(맞힘) / 0(틀림·힌트)
  s.tyb = s.tyb || {};  // 타이핑 단원 → [맞힘, 전체, 시각]
  s.set = Object.assign({ units: ALL_UNITS.slice(), only: "", count: 20, sets: Object.keys(PAIR_SETS) }, s.set || {});
  s.set.units = s.set.units.filter(u => SECTIONS[u]);
  return s;
})();

function applyTheme() {
  const t = getTheme();
  if (t === "auto") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = t;
  const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => {
    if (!m.dataset.orig) m.dataset.orig = m.getAttribute("content");
    m.setAttribute("content", t === "auto" ? m.dataset.orig : bg);

}

function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
// 요약본 기호 강조: ★ → 노란 별, 🎙 → 예시 표시

}

// 필터
function filt(list) {
  const units = new Set(state.set.units), only = state.set.only;
  return list.filter(c => units.has(c.u) && (!only || (only === "star" && c.star) || (only === "jok" && c.jok) || (only === "again" && state.k[c.id] === 0)));
}
function pairPool() { const sets = new Set(state.set.sets); return filt(PAIR_CARDS).filter(c => sets.has(c.set)); }
function tfPool() {
  const units = new Set(state.set.units), only = state.set.only;
  return TFS.filter(t => (units.has(t.u) || (t.u === "x" && units.size === ALL_UNITS.length)) &&
    (only !== "again" || (state.tf[t.id] && state.tf[t.id][1] > 0 && state.tf[t.id][2] === 0)));
}
function poolFor(mode) { if (mode === "type") return TY_CELLS; return mode === "pair" ? pairPool() : mode === "tf" ? tfPool() : filt(CARDS); }

// ───── 시작
function start(mode) {
  if (mode === "browse") return renderBrowse();
  if (mode === "type") { if (location.hash !== "#type") history.pushState(null, "", "#type"); return renderType(); }
  let pool = poolFor(mode);
  if (!pool.length) return;
  // 다시 볼 것 → 안 본 것 → 외운 것 순
  const key = c => mode === "tf" ? (state.tf[c.id] ? (state.tf[c.id][2] === 0 ? 0 : 2) : 1) : (state.k[c.id] === 0 ? 0 : state.k[c.id] === undefined ? 1 : 2);
  pool = pool.map(c => ({ c, k: key(c) + Math.random() * 0.9 })).sort((a, b) => a.k - b.k).map(x => x.c);
  pool.forEach(c => (c._re = 0));
  const n = state.set.count ? Math.min(state.set.count, pool.length) : pool.length;
  session = { mode, queue: pool.slice(0, n), total: n, done: 0, knew: 0, missed: [], flipped: false, answered: false };
  next();
}

function next() {
  if (!session.queue.length) return renderEnd();
  session.cur = session.queue[0];
  session.flipped = false; session.answered = false;
  session.mode === "tf" ? renderTF() : renderFlash();
}

    <span class="count">${Math.min(s.done + 1, s.total)}<small>/${s.total}</small></span></div>`;
}
function bindQuit() {
  $("#quit").onclick = () => { if (!session.done || confirm("여기까지 기록은 저장돼요. 그만할까요?")) session.done ? renderEnd() : renderHome(); };

    const gh = app().querySelector(`[data-gh="${c.g}"] .ty-gs`);
    if (gh) { const gids = TY_CELLS.filter(x => x.g === c.g); gh.textContent = gids.filter(x => ty.st[x.id] === "ok").length + "/" + gids.length; }
    tyFocusNext(inp);
  }
}
function tyCheckOne(inp, strict) {
  const id = inp.dataset.id;
  if (inp.readOnly || !inp.value.trim()) return;
  if (!tyAnswers(TY_BYPOS[id].a).has(tyNorm(inp.value)) && strict) inp.classList.add("no");
}
function tyFocusNext(inp) {
  const all = [...app().querySelectorAll(".ty-in")];
  const i = all.indexOf(inp);
  const nx = all.slice(i + 1).find(x => !x.readOnly) || all.slice(0, i).find(x => !x.readOnly);
  if (nx) { nx.focus({ preventScroll: true }); const r = nx.getBoundingClientRect(); if (r.top < 80 || r.bottom > window.innerHeight - 160) nx.scrollIntoView({ block: "center", behavior: "smooth" }); }
  else inp.blur();
}
function tyHint() {
  let inp = document.activeElement && document.activeElement.classList.contains("ty-in") ? document.activeElement : tyLast;
  if (!inp || inp.readOnly || !document.body.contains(inp)) inp = app().querySelector(".ty-in:not([readonly])");
  if (!inp) return;
  const id = inp.dataset.id, a = TY_BYPOS[id].a;
  // 이미 맞게 친 앞부분 다음 글자 하나를 채움
  let k = 0; const v = inp.value;
  while (k < v.length && k < a.length && v[k].toLowerCase() === a[k].toLowerCase()) k++;
  inp.value = a.slice(0, k + 1);
  ty.st[id] = "hint"; state.ty[id] = 0; save();
  inp.classList.add("hint");
  inp.focus({ preventScroll: true });
  tyInput(inp);
}
// g 가 있으면 그 중분류만 채점
function tyCheck(g) {
  const ids = g ? TY_CELLS.filter(c => c.g === g).map(c => c.id) : tyIds();
  let ok = 0;
  ids.forEach(id => {
    const c = TY_BYPOS[id], v = ty.val[id] || "";
    if (ty.st[id] === "ok") { ok++; state.ty[id] = 1; return; }
    if (tyAnswers(c.a).has(tyNorm(v)) && ty.st[id] !== "hint") { ty.st[id] = "ok"; ok++; state.ty[id] = 1; return; }
    if (ty.st[id] === "hint" && tyAnswers(c.a).has(tyNorm(v))) { state.ty[id] = 0; return; }
    ty.st[id] = "show"; state.ty[id] = 0;
  });
  if (!g) { ty.checked = true; state.tyb[ty.si] = [ok, ids.length, Date.now()]; }
  save();
  if (g) {
    // 그 중분류 제목 위치를 그대로 두고 다시 그림
    const h0 = app().querySelector(`[data-gh="${g}"]`), top0 = h0 ? h0.getBoundingClientRect().top : 0;
    renderType();
    const h1 = app().querySelector(`[data-gh="${g}"]`);
    if (h1) window.scrollBy(0, h1.getBoundingClientRect().top - top0);
    const gs = h1 && h1.querySelector(".ty-gs");
    if (gs) gs.classList.add(ok === ids.length ? "all" : "some");
    return;
  }
  renderType();
  const first = app().querySelector(".ty-in.show, .ty-in.hint");
  if (first) first.scrollIntoView({ block: "center" }); else window.scrollTo(0, 0);
  $("#tyRes").textContent = ok === ids.length ? "전부 맞혔어요!" : `틀림·힌트 ${ids.length - ok}칸 — 빨간 글씨가 정답, 노란 글씨는 힌트를 쓴 칸이에요.`;
}

// ───── 키보드
document.addEventListener("keydown", e => {
  if (!session || !session.cur) return;
  if (e.target && e.target.tagName === "INPUT") return;
  const k = e.key.toLowerCase();
  if (session.mode === "tf") {
    if (!session.answered && (k === "o" || k === "1")) answerTF(true);
    else if (!session.answered && (k === "x" || k === "2")) answerTF(false);
    else if (session.answered && (k === "enter" || k === " ")) { e.preventDefault(); session.queue.shift(); next(); }
    return;
  }
  if (!session.flipped && (k === " " || k === "enter")) { e.preventDefault(); session.flipped = true; renderFlash(); }
  else if (session.flipped && k === "1") grade(false);
  else if (session.flipped && (k === "2" || k === "enter")) grade(true);
});

location.hash === "#type" ? renderType() : renderHome();
registerSW();

</script>
